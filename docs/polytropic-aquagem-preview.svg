  <text x="708" y="445" fill="#aebed0" font-size="14">600 tr/min</text><text x="1068" y="445" fill="#aebed0" font-size="14" text-anchor="end">3 000 tr/min</text>

<rect x="644" y="480" width="158" height="87" rx="13" fill="#223448" stroke="#4d677e" stroke-width="1"/>
<text x="723" y="514" text-anchor="middle" fill="#f5fbff" font-size="20" font-weight="700">Éco</text><text x="723" y="544" text-anchor="middle" fill="#d2e4f1" font-size="16">1 200 tr/min</text>
<rect x="815" y="480" width="158" height="87" rx="13" fill="#145083" stroke="#39b7ff" stroke-width="2"/>
