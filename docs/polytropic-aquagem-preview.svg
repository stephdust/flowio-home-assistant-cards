<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc">
<title id="title">Aperçu des deux cartes Flow.io, PAC Polytropic et pompe AquaGem</title>
<desc id="desc">Maquette illustrative en thème sombre avec mesures de démonstration. La carte PAC affiche la température de piscine, consigne, Fan1 en tours par minute, température extérieure, entrée et sortie eau. La carte AquaGem affiche vitesses réelle et demandée, curseur et présélections.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101e2c"/><stop offset="1" stop-color="#08131e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#192b3c"/><stop offset="1" stop-color="#111c2a"/></linearGradient>
  <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#298aff"/><stop offset="1" stop-color="#0bd5e6"/></linearGradient>
</defs>
<rect width="1200" height="625" rx="24" fill="url(#bg)"/>
<text x="42" y="42" fill="#a9c1d5" font-family="Arial,sans-serif" font-size="16">Flow.io · Home Assistant · Aperçu illustratif</text>
