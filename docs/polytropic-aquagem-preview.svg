<rect x="986" y="480" width="158" height="87" rx="13" fill="#223448" stroke="#4d677e" stroke-width="1"/>
<text x="1065" y="514" text-anchor="middle" fill="#f5fbff" font-size="20" font-weight="700">Boost</text><text x="1065" y="544" text-anchor="middle" fill="#d2e4f1" font-size="16">2 700 tr/min</text>
</g><text x="600" y="609" text-anchor="middle" fill="#7e97ac" font-family="Arial,sans-serif" font-size="12">Maquette de présentation · valeurs fictives · les mesures réelles dépendent des entités Home Assistant</text></svg>